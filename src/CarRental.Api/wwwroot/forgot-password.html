<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password · Car Rental</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
  <main class="auth-shell auth-shell--single">
    <div class="auth-card auth-card--narrow">
      <a class="brand" href="/signin.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5.6 6.5A2.5 2.5 0 0 1 8 4.8h8a2.5 2.5 0 0 1 2.4 1.7l1.1 3.2a2.5 2.5 0 0 1 1.6 2.3v3.6a1 1 0 0 1-1 1h-.7v.9a1.4 1.4 0 0 1-2.8 0v-.9H7.4v.9a1.4 1.4 0 0 1-2.8 0v-.9h-.7a1 1 0 0 1-1-1V12a2.5 2.5 0 0 1 1.6-2.3l1.1-3.2Zm1.9.6-1 2.9h11l-1-2.9a.6.6 0 0 0-.5-.4H8a.6.6 0 0 0-.5.4ZM7 13.9a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm10 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z"/></svg>
        </span>
        Car Rental
      </a>
      <h2>Forgot your password?</h2>
      <p class="sub">Enter the address on your account and we will send you a link to set a new password.</p>

      <form id="forgot-form" novalidate>
        <div class="alert" role="alert"></div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus>
          <p class="err" data-for="email"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit">Send reset link</button>
        <p class="form-foot"><a href="/signin.html">Back to sign in</a></p>
      </form>
    </div>
  </main>

  <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
