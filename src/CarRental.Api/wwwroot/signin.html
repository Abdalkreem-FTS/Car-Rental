<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Car Rental</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
  <main class="auth-shell">
    <aside class="auth-aside">
      <a class="brand" href="/signin.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5.6 6.5A2.5 2.5 0 0 1 8 4.8h8a2.5 2.5 0 0 1 2.4 1.7l1.1 3.2a2.5 2.5 0 0 1 1.6 2.3v3.6a1 1 0 0 1-1 1h-.7v.9a1.4 1.4 0 0 1-2.8 0v-.9H7.4v.9a1.4 1.4 0 0 1-2.8 0v-.9h-.7a1 1 0 0 1-1-1V12a2.5 2.5 0 0 1 1.6-2.3l1.1-3.2Zm1.9.6-1 2.9h11l-1-2.9a.6.6 0 0 0-.5-.4H8a.6.6 0 0 0-.5.4ZM7 13.9a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Zm10 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z"/></svg>
        </span>
        Car Rental
      </a>
      <h1>Welcome back.</h1>
      <p>Sign in to browse the fleet, manage your bookings and keep your details up to date.</p>
      <ul class="auth-points">
        <li>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>
          <span>16 cars across Amman, Irbid, Aqaba, Zarqa and the Dead Sea.</span>
        </li>
        <li>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg>
          <span>Economy runabouts to eight-seat vans and full-size SUVs.</span>
        </li>
      </ul>
    </aside>

    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="sub">New here? <a href="/signup.html">Create an account</a>.</p>

      <form id="signin-form" novalidate>
        <div class="alert" role="alert"></div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus>
          <p class="err" data-for="email"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-toggle="password">Show</button>
          </div>
          <p class="err" data-for="password"></p>
          <p class="hint"><a href="/forgot-password.html">Forgot your password?</a></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit">Sign in</button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/signin.js"></script>
</body>
</html>
